[build-system]
requires = ["hatchling<1.30"]
build-backend = "hatchling.build"

[project]
name = "agentlock"
version = "1.10.1"
description = "Authorization framework for AI agent tool calls. Your AI agent needs a login screen. AgentLock is that login screen."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "David Grice", email = "webpro255@users.noreply.github.com" },
]
keywords = [
    "ai",
    "agent",
    "authorization",
    "security",
    "llm",
    "tool-calling",
    "permissions",
    "access-control",
    "rbac",
    "ai-safety",
    "red-team",
    "owasp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
autogen = ["pyautogen>=0.2,<0.10; python_version < '3.14'"]
mcp = ["mcp>=1.0"]
fastapi = ["fastapi>=0.100", "python-jose[cryptography]>=3.3"]
flask = ["flask>=2.0"]
crypto = ["PyNaCl>=1.5.0"]
all = [
    "pyautogen>=0.2,<0.10; python_version < '3.14'",
    "mcp>=1.0",
    "fastapi>=0.100",
    "python-jose[cryptography]>=3.3",
    "flask>=2.0",
    "PyNaCl>=1.5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
agentlock = "agentlock.cli:main"

[project.urls]
Homepage = "https://agentlock.dev"
Documentation = "https://agentlock.dev/docs"
Repository = "https://github.com/webpro255/agentlock"
Issues = "https://github.com/webpro255/agentlock/issues"
Changelog = "https://github.com/webpro255/agentlock/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["agentlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["SIM108", "SIM114"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["B008"]
# Held verbatim.  tests/test_v110_system_review.py is an external review's own
# test file, saved exactly as received and edited only to add the five
# pytest.importorskip guards that let it be collected where a framework is
# absent.  It is the contract for the 1.10 hardening arc, so it is not
# reformatted to this project's style: rewriting the artifact that defines
# done would make it a restatement rather than an independent check.  The
# reviewer's 1.10.0 recheck appended 32 cases as a second file, which is why
# E402 and F811 join the list: the second import block and its redefinitions
# are what "saved exactly as received" looks like for two concatenated files.
"tests/test_v110_system_review.py" = [
    "E402", "E501", "E701", "E702", "F811", "I001", "SIM105",
]

[tool.coverage.run]
source = ["agentlock"]
omit = ["agentlock/integrations/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
